<script>
/* The modules are pasted in below. Each one fills module.exports; the page keeps them in REGISTRY so that
   a module can ask for another with require('./physics.js'). Physics and scoring also stay global names. */
var module = { exports: {} };
const REGISTRY = {};
const require = (name) => REGISTRY[name];
</script>
<script>
// Racket movement. Pure functions: no page, no clock, no chance.
// Court units: x runs 0..360 across, y runs 0 (computer baseline) .. 560 (your baseline).
const COURT_W = 360;
const COURT_L = 560;
const NET_Y = 280;
const RACKET_SPEED = 900;     // units per second a racket can travel (top speed)
const EASE_GAIN = 12;         // a racket runs at EASE_GAIN x its distance to the target per second (up to RACKET_SPEED): a small twitch is a small, smooth move
const RACKET_HALF_W = 28;     // drawn racket head half-width; where the ball meets it (-1 left edge .. 1 right edge) sets the direction
const COMPUTER_NET_SPEED = 90; // the computer settles for a ball: in reach of it, it does not move toward the net faster than this unless it lunges (below the power threshold)
const COMPUTER_SETTLE_GAIN = 12; // farther from the ball it may run toward the net this much faster per unit of distance (it slows down as it comes close)
const LUNGE_DISTANCE = 60;    // a lunging computer racket aims this far past the ball toward the net, so it runs through the ball
const RACKET_HALF_H = 24;      // drawn racket head half-height incl. outline; the page uses it too
const NET_GAP = RACKET_HALF_H + 4; // racket centre stays this far from the net, so the head and the net band never overlap
const BEHIND_BASELINE = 30;   // how far behind the baseline a racket may stand
const SIDE_MARGIN = 20;       // how far outside a sideline a racket may stand
const START_INSET = 40;       // start distance from own baseline

// Ball and shot constants (court units, seconds). Tune the feel here.
const GRAVITY = 900;          // units/s^2 pulling the ball down
const NET_HEIGHT = 24;        // a ball crossing the net lower than this hits it
const NET_CLEARANCE = 10;     // a shot is aimed to pass the net at least this far above its top
const SERVICE_LEN = 151;      // service line distance from the net
const RESTITUTION = 0.72;     // share of vertical speed kept after a bounce
const GROUND_DRAG = 0.88;     // share of ground speed kept after a bounce
const MIN_BOUNCE_VZ = 40;     // a ball landing slower than this just rolls (no bounce)
const NET_BOUNCE = 0.2;       // share of speed kept when the ball hits the net
const FLAT_SPEED = 520;       // nominal forward speed of a flat shot, units/s
const MIN_SHOT_VZ = 60;       // a shot always leaves the racket at least this fast upward
const RETURN_DEPTH = 100;     // a flat shot lands this far in front of the opponent baseline
const SHOT_SIDE_INSET = 24;   // a shot aims at least this far inside a sideline
const LOB_SPEED = 300;        // forward speed of a lob, units/s (a flat shot flies at FLAT_SPEED)
const LOB_DEPTH = 40;         // a lob lands this far in front of the opponent baseline
const LOB_MIN_TIME = 1.2;     // a lob stays in the air at least this long (s), so even one hit at the net climbs above a volley at the net
const HIT_REACH = 34;         // the racket reaches a ball this close (court units, flat on the ground)
const HIT_HEIGHT = 45;        // ...and no higher than this
const VOLLEY_HEIGHT = 100;    // a ball still in the air (a volley) is reached this high: a normal return crosses the net up to about 88 high
const SMASH_DROP = 15;        // a shot from above the ground reach (a high volley) may leave the racket downward: the floor of MIN_SHOT_VZ drops by this much per unit of height above HIT_HEIGHT
const NET_STAND_DIST = 70;    // the computer at the net stands this far from the net
const FEED_HEIGHT = 30;       // height at which the opening shot of a rally is hit
const MAX_DT = 0.05;          // longest time step used; longer ones are cut to this
const SUBSTEP = 1 / 240;      // inner step, so a fast ball cannot skip the net or the ground
const MAX_SPEED = 3000;       // speed limit that keeps bad numbers from flinging the ball away
const POS_LIMIT = 1500;       // the ball is kept within this distance of the court
const CORD_BAND = 4;          // a ball crossing the net less than this above its top touches the cord (a let if it was a serve)

// Serve constants. Power runs from 0 (soft, shallow) to 1 (hard, deep, and more error).
const SERVE_HEIGHT = 50;      // height at which a serve is hit
const SERVE_BEHIND = 10;      // a serve starts this far behind the baseline
const SERVE_OFFSET = 60;      // ...and this far from the centre mark
const SERVE_BOX_INSET = 15;   // a serve is aimed at least this far inside the lines of its box
const SERVE_DEPTH_MIN = 90;   // landing distance from the net at power 0
const SERVE_DEPTH_MAX = 140;  // ...and at power 1 (the service line is 151)
const SERVE_SPEED_MIN = 450;  // forward speed at power 0, units/s
const SERVE_SPEED_MAX = 1000; // ...and at power 1
const SERVE_ERR_BASE = 4;     // landing error (units, either way) at power 0
const SERVE_ERR_POWER = 40;   // extra landing error at power 1
const SERVE_ARC_ERR = 1.2;    // vertical speed error per unit of landing error: the serve sometimes clips the net

function num(v, fallback) {
  return typeof v === 'number' && !Number.isNaN(v) ? v : fallback;
}

function startRacket(side) {
  return { x: COURT_W / 2, y: side === 'top' ? START_INSET : COURT_L - START_INSET };
}

// Keeps a racket inside its own half, behind the net.
function clampRacket(racket, side) {
  const start = startRacket(side);
  const x = Math.min(COURT_W + SIDE_MARGIN, Math.max(-SIDE_MARGIN, num(racket && racket.x, start.x)));
  const lo = side === 'top' ? -BEHIND_BASELINE : NET_Y + NET_GAP;
  const hi = side === 'top' ? NET_Y - NET_GAP : COURT_L + BEHIND_BASELINE;
  const y = Math.min(hi, Math.max(lo, num(racket && racket.y, start.y)));
  return { x, y };
}

// Moves toward a target (mouse or finger) at no more than RACKET_SPEED.
function moveRacketToward(racket, target, dt, side) {
  const here = clampRacket(racket, side);
  if (!target || !Number.isFinite(dt) || dt <= 0 || !Number.isFinite(target.x) || !Number.isFinite(target.y)) return here;
  const goal = clampRacket(target, side);
  const dx = goal.x - here.x;
  const dy = goal.y - here.y;
  const dist = Math.hypot(dx, dy);
  const step = Math.min(RACKET_SPEED, EASE_GAIN * dist) * dt;
  if (dist <= step || dist < 0.01) return goal;
  return clampRacket({ x: here.x + (dx / dist) * step, y: here.y + (dy / dist) * step }, side);
}

// Moves with held arrow keys: { left, right, up, down } booleans.
function moveRacketByKeys(racket, keys, dt, side) {
  const here = clampRacket(racket, side);
  if (!keys || !Number.isFinite(dt) || dt <= 0) return here;
  const dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const dy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
  if (dx === 0 && dy === 0) return here;
  const len = Math.hypot(dx, dy);
  const step = RACKET_SPEED * dt;
  return clampRacket({ x: here.x + (dx / len) * step, y: here.y + (dy / len) * step }, side);
}

function finite(v, fallback) {
  return typeof v === 'number' && Number.isFinite(v) ? v : fallback;
}
function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
function other(side) { return side === 'top' ? 'bottom' : 'top'; }

// Lines count as in: the whole court, edges included.
function inCourt(x, y) {
  return Number.isFinite(x) && Number.isFinite(y) && x >= 0 && x <= COURT_W && y >= 0 && y <= COURT_L;
}

// In the court and on one side of the net ('top' is y 0..280, 'bottom' is 280..560); the net line counts for both.
function inHalf(x, y, side) {
  if (!inCourt(x, y)) return false;
  return side === 'top' ? y <= NET_Y : side === 'bottom' ? y >= NET_Y : false;
}

// The service box on one side of the net: side 'top'|'bottom', half 'left'|'right' as seen on screen
// (left is x 0..180). The service line, centre line, sideline and net line all count as in.
function inServiceBox(x, y, side, half) {
  if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
  const yOk = side === 'top' ? y >= NET_Y - SERVICE_LEN && y <= NET_Y : side === 'bottom' ? y >= NET_Y && y <= NET_Y + SERVICE_LEN : false;
  const xOk = half === 'left' ? x >= 0 && x <= COURT_W / 2 : half === 'right' ? x >= COURT_W / 2 && x <= COURT_W : false;
  return yOk && xOk;
}

// Makes a ball with every field a finite number. hitter is who hit it last ('top' | 'bottom'); power (0..1) is how hard that hit was.
function makeBall(b) {
  const o = b && typeof b === 'object' ? b : {};
  const sp = (v) => clamp(finite(v, 0), -MAX_SPEED, MAX_SPEED);
  return {
    x: clamp(finite(o.x, COURT_W / 2), -POS_LIMIT, POS_LIMIT),
    y: clamp(finite(o.y, NET_Y), -POS_LIMIT, POS_LIMIT),
    z: clamp(finite(o.z, 0), 0, POS_LIMIT),
    vx: sp(o.vx), vy: sp(o.vy), vz: sp(o.vz),
    hitter: o.hitter === 'top' || o.hitter === 'bottom' ? o.hitter : 'top',
    bounces: Math.max(0, Math.floor(finite(o.bounces, 0))),
    live: o.live !== false,
    power: clamp(finite(o.power, 0), 0, 1)   // how hard the last hit was, 0..1 (set by hitBall; the page shows a power hit)
  };
}

// Moves the ball forward by dt seconds (at most MAX_DT). Returns { ball, events } where events are
// { type: 'net', hitter }, { type: 'cord', hitter } (touched the top of the net and flew on) or { type: 'bounce', x, y, n, hitter } (n counts bounces since the last hit).
// A ball that is not live (the point is decided) still moves but reports nothing.
function stepBall(ball, dt) {
  let b = makeBall(ball);
  const events = [];
  const total = typeof dt === 'number' && !Number.isNaN(dt) ? Math.min(MAX_DT, dt) : 0;
  if (!(total > 0)) return { ball: b, events };
  // Every step is SUBSTEP long, the last one takes what is left, so the flight of a ball hardly depends on how the time is cut into frames
  // (the same ball lands in the same place whatever dt the page hands in, which is what lets a player judge where it will land).
  const n = Math.max(1, Math.ceil(total / SUBSTEP - 1e-9));
  for (let i = 0; i < n; i++) {
    const h = i < n - 1 ? SUBSTEP : total - (n - 1) * SUBSTEP;
    const { x, y, z, vx, vy } = b;
    let vz = b.vz;
    if (z > 0 || vz > 0) vz -= GRAVITY * h;
    const nx = x + vx * h, ny = y + vy * h;
    let nz = z + vz * h;
    if ((y < NET_Y && ny >= NET_Y) || (y > NET_Y && ny <= NET_Y)) {
      const zc = z + (nz - z) * ((NET_Y - y) / (ny - y));
      if (zc < NET_HEIGHT) {
        if (b.live) events.push({ type: 'net', hitter: b.hitter });
        b = makeBall({ ...b, x: nx, y: y < NET_Y ? NET_Y - 1 : NET_Y + 1, z: Math.max(0, zc), vx: vx * NET_BOUNCE, vy: -vy * NET_BOUNCE, vz: Math.max(0, vz) * NET_BOUNCE });
        continue;
      }
      if (zc < NET_HEIGHT + CORD_BAND && b.live) events.push({ type: 'cord', hitter: b.hitter });
    }
    let bounces = b.bounces;
    let nvx = vx, nvy = vy;
    if (nz <= 0) {
      const zEnd = nz;
      nz = 0;
      if (vz < -MIN_BOUNCE_VZ) {
        vz = -vz * RESTITUTION; nvx *= GROUND_DRAG; nvy *= GROUND_DRAG;
        bounces += 1;
        // report where the ball touched the ground inside this step, not where the step ended
        const frac = z > zEnd ? z / (z - zEnd) : 1;
        if (b.live) events.push({ type: 'bounce', x: x + (nx - x) * frac, y: y + (ny - y) * frac, n: bounces, hitter: b.hitter });
      } else {
        vz = 0;
      }
    }
    b = makeBall({ ...b, x: nx, y: ny, z: nz, vx: nvx, vy: nvy, vz, bounces });
  }
  return { ball: b, events };
}

// The words shown on screen when a rally ends, from the reason judge gives.
function rallyMessage(reason) {
  return reason === 'net' ? 'Net' : reason === 'out' ? 'Out' : reason === 'second bounce' ? 'Missed' : '';
}

// Decides a point from one event of stepBall. Returns null (play on) or { loser, reason }.
// The first bounce must be in the opponent half, lines count as in; a net or out ball loses for the hitter.
// A second bounce loses for the player who should have returned it.
function judge(event) {
  if (!event || (event.hitter !== 'top' && event.hitter !== 'bottom')) return null;
  if (event.type === 'net') return { loser: event.hitter, reason: 'net' };
  if (event.type !== 'bounce') return null;
  if (event.n >= 2) return { loser: other(event.hitter), reason: 'second bounce' };
  return inHalf(event.x, event.y, other(event.hitter)) ? null : { loser: event.hitter, reason: 'out' };
}

// A shot by `side` that lands at x = aimX and `opts.depth` in front of the opponent baseline (default RETURN_DEPTH;
// negative lands beyond it, out). It passes the net at least NET_CLEARANCE above its top, or, with `opts.clearance`,
// that far above it (negative: below the top, so it hits the net). Returns the new ball.
function hitBall(ball, side, aimX, opts) {
  const b = makeBall(ball);
  const o = opts && typeof opts === 'object' ? opts : {};
  const lob = o.lob === true;
  const power = clamp(finite(o.power, 0), 0, 1);   // how hard the racket was moving; the ball carries it so the page can show a power hit
  const tx = clamp(finite(aimX, COURT_W / 2), SHOT_SIDE_INSET, COURT_W - SHOT_SIDE_INSET) + clamp(finite(o.lateral, 0), -200, 200);
  const depth = clamp(finite(o.depth, lob ? LOB_DEPTH : RETURN_DEPTH), -150, 400);
  const arc = clamp(finite(o.arc, 0), -300, 300);
  const speed = FLAT_SPEED * clamp(finite(o.speed, 1), 0.3, 3);
  const ty = side === 'bottom' ? depth : COURT_L - depth;
  const dir = side === 'bottom' ? -1 : 1;
  const dist = Math.max(60, Math.abs(ty - b.y));
  const r = clamp(Math.abs(NET_Y - b.y) / dist, 0, 1);
  if (Number.isFinite(o.clearance)) {
    const h = Math.max(2, NET_HEIGHT + o.clearance);
    if (o.clearance < 0) {
      // a ball that hits the net: normal speed, steered to be h high where it reaches the net
      const t = dist / FLAT_SPEED, tn = Math.max(t * r, 0.005);
      const vz = (h - b.z + 0.5 * GRAVITY * tn * tn) / tn;
      return makeBall({ x: b.x, y: b.y, z: b.z, vx: (tx - b.x) / t, vy: dir * dist / t, vz, hitter: side, bounces: 0, live: true, power });
    }
    // a ball that lands at the aim and is h high at the net: height at the net is z(1-r) + g/2 T^2 r(1-r)
    const k = 0.5 * GRAVITY * r * (1 - r);
    const t = clamp(k > 1e-9 ? Math.sqrt(Math.max(0, (h - b.z * (1 - r)) / k)) : 0.5, 0.12, 3);
    const vz = (0.5 * GRAVITY * t * t - b.z) / t;
    return makeBall({ x: b.x, y: b.y, z: b.z, vx: (tx - b.x) / t, vy: dir * dist / t, vz, hitter: side, bounces: 0, live: true, power });
  }
  if (lob) {
    // a lob: slow and high; it is in the air for dist / LOB_SPEED seconds and lands at the aim
    const t = clamp(dist / LOB_SPEED, LOB_MIN_TIME, 3);
    const vzl = (0.5 * GRAVITY * t * t - b.z) / t + arc;
    return makeBall({ x: b.x, y: b.y, z: b.z, vx: (tx - b.x) / t, vy: dir * dist / t, vz: vzl, hitter: side, bounces: 0, live: true, power });
  }
  const t0 = dist / speed;
  let vz = Math.max(MIN_SHOT_VZ - SMASH_DROP * Math.max(0, b.z - HIT_HEIGHT), (0.5 * GRAVITY * t0 * t0 - b.z) / t0);
  let t = 0;
  for (let i = 0; i < 60; i++) {
    t = (vz + Math.sqrt(vz * vz + 2 * GRAVITY * b.z)) / GRAVITY;
    const tn = t * r;

// Scoring for one set: points, games, deuce, advantage, tiebreak, server and serve side.

  TIEBREAK_AT: 6,        // games each when the tiebreak starts
  TIEBREAK_POINTS: 7,    // first to 7 points in the tiebreak, 2 ahead
  GAME_POINTS: 4,        // first to 4 points in a game, 2 ahead
  PLAYER: 'player',

function isPlayer(who) {
  return who === SCORING.PLAYER || who === SCORING.COMPUTER;
}

  if (who === SCORING.COMPUTER) return SCORING.PLAYER;

    games: { player: 0, computer: 0 },
    points: { player: 0, computer: 0 },
    server,
    tiebreak: false,
    tiebreakServer: server, // who serves the first tiebreak point (updated when it starts)
    winner: null,

}

  const OVER_DELAY = 500;                  // ms the end of the set stays before Space starts a new match
  const HELP = 'Move: mouse, finger or arrows. Lob: Space, right button or Shot. Run at the net to hit hard and volley.';
  const SERVE_HELP = 'hold click, tap or Space for power, move to aim, let go.';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let scale = 1;
  let firstServer = 'player';

  // state.m is the match (see src/match.js); state.speed runs time faster (only used by proof scripts); state.rand is the chance source.
  const state = { choosing: true, started: false, level: 'advanced', pick: 1, flash: null, trail: [], lastHits: 0, m: Match.newMatchState(firstServer), racket: startRacket('bottom'), target: null, keys: {}, overAt: 0, speed: 1, rand: Math.random,
    mouseHeld: false, fingerHeld: false, spaceHeld: false, spaceIgnore: false, rightHeld: false, shotButton: false, holdId: null, moveId: null, holdLatch: false, shotLatch: false, hold: false, shot: false };
  window.__state = state;

  function fit() {
    const stage = document.getElementById('stage');
    scale = Math.max(0.1, Math.min(stage.clientWidth / VIEW_W, stage.clientHeight / VIEW_H));
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = VIEW_W * scale + 'px';
    canvas.style.height = VIEW_H * scale + 'px';
    canvas.width = Math.round(VIEW_W * scale * dpr);
    canvas.height = Math.round(VIEW_H * scale * dpr);
    ctx.setTransform(canvas.width / VIEW_W, 0, 0, canvas.height / VIEW_H, 0, 0);
  }
  // The scoreboard goes beside the court only when it then does not touch the court; otherwise it stays above it.
  function resize() {
    document.body.classList.add('side');
    fit();
    const sb = document.getElementById('score').getBoundingClientRect(), cv = canvas.getBoundingClientRect();
    if (cv.left < sb.right + 8) { document.body.classList.remove('side'); fit(); }
  }
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(() => requestAnimationFrame(resize)).observe(document.getElementById('stage'));   // also when the help line wraps and the stage changes size

  function toCourt(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * VIEW_W - MARGIN, y: (e.clientY - r.top) / r.height * VIEW_H - MARGIN };
  }
  function aim(e) { state.target = toCourt(e); }
  const LEVELS = ['beginner', 'advanced', 'pro'];
  const LEVEL_TEXT = { beginner: 'Beginner', advanced: 'Advanced', pro: 'Pro' };
  // A new match at the current level (New match keeps the level; Change level opens the choice again). The first server alternates.
  function newMatch() {
    firstServer = firstServer === 'player' ? 'computer' : 'player';
    state.m = Match.newMatchState(firstServer, state.level);
    state.racket = startRacket('bottom'); state.target = null;
    state.mouseHeld = state.fingerHeld = state.holdLatch = state.shotLatch = false;
    state.trail = []; state.flash = null; state.lastHits = 0;
  }
  // The level choice: shown at the start and from the end box. Nothing moves until a level is chosen.
  function openChooser() {
    state.choosing = true; state.pick = Math.max(0, LEVELS.indexOf(state.level));
    state.mouseHeld = state.fingerHeld = state.holdLatch = state.shotLatch = state.spaceHeld = false; state.keys = {}; state.moveId = state.holdId = null;
  }
  function chooseLevel(name) {
    if (!state.choosing || LEVELS.indexOf(name) < 0) return;
    state.level = name; state.choosing = false; state.keys = {};
    if (state.started) newMatch(); else { state.m = Match.newMatchState(firstServer, state.level); state.racket = startRacket('bottom'); state.target = null; state.mouseHeld = state.fingerHeld = state.holdLatch = state.shotLatch = false; }
    state.started = true;
  }
  const isButton = (e) => !!(e.target && e.target.closest && e.target.closest('button'));
  // The mouse buttons are read from e.buttons on every pointer event, because the browser reports a second button pressed or released
  // while another is held as a plain pointermove: bit 1 is the left button (serve: hold), bit 2 the right button (the shot button).
  function syncMouse(e) {
    if (e.pointerType !== 'mouse') return;
    const left = !!(e.buttons & 1), right = !!(e.buttons & 2);
    if (right && !state.rightHeld) state.shotLatch = true;
    state.rightHeld = right;
    if (left && !state.mouseHeld) { if (state.m.phase !== 'over' && !isButton(e)) { state.mouseHeld = true; state.holdLatch = true; } }
    else if (!left) state.mouseHeld = false;
  }
  // A finger moves the racket; only the finger that went down on the court does (another finger may hold the Shot button).
  window.addEventListener('pointermove', (e) => { syncMouse(e); if (e.pointerType !== 'touch' || e.pointerId === state.moveId) aim(e); });
  // Left button, a finger or a pen: move there and hold (serve button). Right button: the shot button. The context menu is blocked.
  window.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'touch') document.body.classList.add('touch');
    if (isButton(e) || state.choosing) return;
    syncMouse(e);
    if (e.pointerType === 'touch' && state.moveId === null) state.moveId = e.pointerId;
    if (e.pointerType !== 'touch' || e.pointerId === state.moveId) aim(e);
    if (e.pointerType !== 'mouse' && e.button === 0 && state.m.phase !== 'over') { state.holdLatch = true; state.fingerHeld = true; state.holdId = e.pointerId; }
  });
  const release = (e) => {
    syncMouse(e);
    if (e.pointerId === state.moveId) state.moveId = null;
    if (e.pointerId === state.holdId) { state.fingerHeld = false; state.holdId = null; }
  };
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  window.addEventListener('contextmenu', (e) => e.preventDefault());
  const shotBtn = document.getElementById('shot');
  shotBtn.addEventListener('pointerdown', (e) => { state.shotButton = true; state.shotLatch = true; shotBtn.classList.add('down'); try { shotBtn.setPointerCapture(e.pointerId); } catch (x) { /* none */ } e.preventDefault(); });
  const shotUp = () => { state.shotButton = false; shotBtn.classList.remove('down'); };
  shotBtn.addEventListener('pointerup', shotUp);
  shotBtn.addEventListener('pointercancel', shotUp);
  shotBtn.addEventListener('lostpointercapture', shotUp);
  document.getElementById('again').addEventListener('click', (e) => { e.currentTarget.blur(); newMatch(); });
  document.getElementById('change').addEventListener('click', (e) => { e.currentTarget.blur(); openChooser(); });
  for (const b of document.querySelectorAll('.lv')) b.addEventListener('click', (e) => { e.currentTarget.blur(); chooseLevel(e.currentTarget.dataset.level); });
  const KEYMAP = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
  window.addEventListener('keydown', (e) => {
    if (state.choosing) {
      // the level choice: 1 2 3, or the arrows to pick and Space or Enter to confirm
      if (e.key === '1' || e.key === '2' || e.key === '3') { chooseLevel(LEVELS[Number(e.key) - 1]); e.preventDefault(); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { state.pick = (state.pick + 2) % 3; e.preventDefault(); }
      else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { state.pick = (state.pick + 1) % 3; e.preventDefault(); }
      else if ((e.key === ' ' || e.code === 'Space' || e.key === 'Enter') && !e.repeat) { chooseLevel(LEVELS[state.pick]); if (e.key !== 'Enter') state.spaceIgnore = true; e.preventDefault(); }
      else if (e.key === ' ' || e.key === 'Enter') e.preventDefault();
      return;
    }
    if (state.m.phase === 'over' && (e.key === 'l' || e.key === 'L')) { openChooser(); e.preventDefault(); return; }
    if (KEYMAP[e.key]) { state.keys[KEYMAP[e.key]] = true; e.preventDefault(); }
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      // Space starts a new match only after the set has been on screen for a moment, and not from a held (repeating) key.
      if (state.m.phase === 'over') { if (!e.repeat && performance.now() - state.overAt > OVER_DELAY) { newMatch(); state.spaceIgnore = true; } }
      else if (!state.spaceIgnore) { if (!state.spaceHeld) { state.holdLatch = true; state.shotLatch = true; } state.spaceHeld = true; }
    }
  });
  window.addEventListener('keyup', (e) => {
    if (KEYMAP[e.key]) { state.keys[KEYMAP[e.key]] = false; e.preventDefault(); }
    if (e.key === ' ' || e.code === 'Space') { state.spaceHeld = false; state.spaceIgnore = false; }
  });
  window.addEventListener('blur', () => { state.keys = {}; state.spaceHeld = state.mouseHeld = state.fingerHeld = state.rightHeld = state.shotButton = false; shotBtn.classList.remove('down'); });

  function update(dt) {
    if (state.choosing) return;
    const m0 = state.m;
    const serving = m0.phase === 'waiting' && m0.server === 'bottom';   // then the racket only slides along the baseline
    const k = serving ? { left: state.keys.left, right: state.keys.right } : state.keys;
    if (k.left || k.right || k.up || k.down) {
      state.racket = moveRacketByKeys(state.racket, k, dt, 'bottom');
      state.target = null;
    } else if (state.target) {
      const goal = serving ? { x: state.target.x, y: serveSpot('bottom') } : state.target;
      state.racket = moveRacketToward(state.racket, goal, dt, 'bottom');
    }
    state.hold = state.mouseHeld || state.fingerHeld || state.spaceHeld || state.holdLatch;
    state.shot = state.spaceHeld || state.rightHeld || state.shotButton || state.shotLatch;
    state.m = Match.stepMatch(state.m, { racket: state.racket, hold: state.hold, shot: state.shot }, dt, state.rand);
    state.holdLatch = false; state.shotLatch = false;
    state.racket = state.m.racket;
  }

  // ---- scoreboard and texts (DOM), written from the match score
  function text(id, v) { const el = document.getElementById(id); if (el.textContent !== v) el.textContent = v; }
  function showScore() {
    const m = state.m, s = m.score;
    text('g-you', String(s.games.player)); text('g-cpu', String(s.games.computer));
    text('p-you', Scoring.pointText(s, 'player')); text('p-cpu', Scoring.pointText(s, 'computer'));
    text('points-head', s.tiebreak && s.winner === null ? 'Tiebreak' : 'Points');
    text('serve-you', s.server === 'player' ? '●' : ''); text('serve-cpu', s.server === 'computer' ? '●' : '');
    text('level', 'Level: ' + LEVEL_TEXT[m.level || state.level]);
    let help = HELP;
    if (m.phase === 'over') help = 'Space or New match: same level again. L or Change level: choose another.';
    if (m.phase === 'waiting' && m.server === 'bottom') help = (m.faults > 0 ? 'Second serve: ' : 'Your serve: ') + SERVE_HELP;
    if (state.choosing) help = 'Choose how strong the computer is.';
    text('help', help);
    const over = document.getElementById('over');
    if (m.phase === 'over' && over.hidden && !state.choosing) state.overAt = performance.now();
    over.hidden = m.phase !== 'over' || state.choosing;
    const choose = document.getElementById('choose');
    choose.hidden = !state.choosing;
    document.querySelectorAll('.lv').forEach((b, i) => b.classList.toggle('pick', i === state.pick));
    if (m.phase === 'over') {
      text('over-title', s.winner === 'player' ? 'You win the set!' : 'The computer wins the set');
      text('over-score', 'Games ' + s.games.player + ' - ' + s.games.computer);
    }
  }

  function line(x1, y1, x2, y2, w) {
    ctx.lineWidth = w || 2;
    ctx.beginPath(); ctx.moveTo(MARGIN + x1, MARGIN + y1); ctx.lineTo(MARGIN + x2, MARGIN + y2); ctx.stroke();
  }

  // The head faces the net; the handle points away from it. Head half-height 22 + 1.5 outline <= RACKET_HALF_H; half-width 26.5 + 1.5 = RACKET_HALF_W.
  function drawRacket(r, color, dir) {
    const x = MARGIN + r.x, y = MARGIN + r.y;
    ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(x, y + dir * 8); ctx.lineTo(x, y + dir * 30); ctx.stroke();
    ctx.fillStyle = color; ctx.strokeStyle = '#f4f4f4'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(x, y, RACKET_HALF_W - 1.5, RACKET_HALF_H - 2, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }

  // The shadow stays on the ground at the ball's x and y; the ball is lifted by its height. Higher: shadow smaller and paler.
  // A lob has no ceiling: a very high ball is drawn above the top of the picture (off the canvas) while its shadow stays on the court.
  const POWER_SIGN = REGISTRY['./shots.js'].SHOTS.POWER_SIGN;
  const POWER_COLOR = '255, 122, 24';
  const TRAIL_TIME = 0.22;                 // seconds of game time the trail of a power ball reaches back
  function drawBall() {
    const b = state.m.ball;
    if (!b) { state.trail = []; return; }
    const lift = b.z * HEIGHT_SCALE;
    const sign = b.power >= POWER_SIGN && b.live;
    // A power ball: a trail of where it was in the last TRAIL_TIME seconds of the game (so it is as long in slow motion) and an orange glow.
    const now = state.m.clock || 0;
    state.trail.push({ x: MARGIN + b.x, y: MARGIN + b.y - lift, c: now });
    state.trail = state.trail.filter((p) => now - p.c <= TRAIL_TIME && now >= p.c).slice(-60);
    if (!sign) state.trail = [];
    for (const p of state.trail) {
      const k = 1 - (now - p.c) / TRAIL_TIME;
      ctx.fillStyle = 'rgba(' + POWER_COLOR + ',' + (0.6 * k).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, BALL_R * (0.5 + 0.9 * k), 0, Math.PI * 2); ctx.fill();
    }
    const k = 1 / (1 + b.z / 120);
    ctx.fillStyle = 'rgba(0,0,0,' + (0.18 + 0.32 * k).toFixed(3) + ')';
    ctx.beginPath(); ctx.ellipse(MARGIN + b.x, MARGIN + b.y, BALL_R * (0.8 + 0.7 * k), BALL_R * (0.8 + 0.7 * k) * 0.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e8f24a'; ctx.strokeStyle = '#6b7a10'; ctx.lineWidth = 1.5;
    const top = MARGIN + b.y - lift;
    if (sign) { ctx.fillStyle = 'rgba(' + POWER_COLOR + ',0.45)'; ctx.beginPath(); ctx.arc(MARGIN + b.x, top, BALL_R * 2.2, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#e8f24a'; ctx.strokeStyle = 'rgb(' + POWER_COLOR + ')'; ctx.lineWidth = 2.5; }
    ctx.beginPath(); ctx.arc(MARGIN + b.x, top, BALL_R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }

  // Power while it builds: speed streaks behind the racket that grow with the power; from POWER_SIGN on an orange ring and the word POWER.
  function drawPowerSign(r, power) {
    if (power <= 0.04) return;
    const x = MARGIN + r.x, y = MARGIN + r.y;
    for (let i = -2; i <= 2; i++) {
      ctx.strokeStyle = 'rgba(' + POWER_COLOR + ',' + (0.75 + 0.25 * power).toFixed(3) + ')'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x + i * 10, y + 30); ctx.lineTo(x + i * 10, y + 30 + 14 + 46 * power * (1 - Math.abs(i) * 0.2)); ctx.stroke();
    }
    ctx.lineCap = 'square';
    if (power < POWER_SIGN) return;
    ctx.strokeStyle = 'rgb(' + POWER_COLOR + ')'; ctx.lineWidth = 4 + 3 * power;
    ctx.beginPath(); ctx.ellipse(x, y, RACKET_HALF_W + 2 + 5 * power, RACKET_HALF_H + 2 + 5 * power, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgb(' + POWER_COLOR + ')'; ctx.font = 'bold 13px system-ui, sans-serif'; ctx.textAlign = r.x > 180 ? 'right' : 'left';
    ctx.fillText('POWER', x + (r.x > 180 ? -RACKET_HALF_W - 14 : RACKET_HALF_W + 14), y + 4);
  }
  // A ring that opens around the ball where a power hit leaves the racket.
  function drawFlash() {
    const f = state.flash;
    if (!f) return;
    const age = (performance.now() - f.t) / 1000;
    if (age > 0.35) { state.flash = null; return; }
    ctx.strokeStyle = 'rgba(' + POWER_COLOR + ',' + (0.9 * (1 - age / 0.35)).toFixed(3) + ')'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(f.x, f.y, 12 + 70 * age, 0, Math.PI * 2); ctx.stroke();
  }

  // The power of the serve being built up: an upright bar beside the racket that fills from green to red (below the racket there is no room).
  function drawPower(r, charge) {
    const w = 10, h = 64, x = MARGIN + r.x + (r.x < 90 ? RACKET_HALF_W + 10 : -RACKET_HALF_W - 10 - w), y = MARGIN + r.y - h + 20;
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
    ctx.fillStyle = 'hsl(' + Math.round(120 - 120 * charge) + ', 85%, 50%)'; ctx.fillRect(x, y + h * (1 - charge), w, h * charge);
  }

  function draw() {
    const m = state.m;
    ctx.fillStyle = '#2f6b4f'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = '#3d8a5f'; ctx.fillRect(MARGIN, MARGIN, COURT_W, COURT_L);
    ctx.strokeStyle = '#ffffff'; ctx.lineCap = 'square';
    line(0, 0, COURT_W, 0); line(0, COURT_L, COURT_W, COURT_L);          // baselines
    line(0, 0, 0, COURT_L); line(COURT_W, 0, COURT_W, COURT_L);          // sidelines
    line(0, NET_Y - SERVICE, COURT_W, NET_Y - SERVICE);                  // service lines
    line(0, NET_Y + SERVICE, COURT_W, NET_Y + SERVICE);
    line(COURT_W / 2, NET_Y - SERVICE, COURT_W / 2, NET_Y + SERVICE);    // centre line
    // net with posts
    ctx.strokeStyle = '#d9dde0'; line(-14, NET_Y, COURT_W + 14, NET_Y, 6);
    ctx.strokeStyle = '#8b949a'; ctx.setLineDash([3, 3]); line(-14, NET_Y + 3, COURT_W + 14, NET_Y + 3, 2); ctx.setLineDash([]);
    ctx.fillStyle = '#222'; ctx.fillRect(MARGIN - 18, MARGIN + NET_Y - 5, 8, 10); ctx.fillRect(MARGIN + COURT_W + 10, MARGIN + NET_Y - 5, 8, 10);
    drawRacket(m.opponent, '#d94b4b', -1);
    drawBall();
    drawRacket(m.racket, '#3b82f6', 1);
    if (m.phase === 'play') drawPowerSign(m.racket, m.power || 0);
    if (m.ball && m.hits !== state.lastHits && m.ball.power >= POWER_SIGN && m.phase === 'play') state.flash = { x: MARGIN + m.ball.x, y: MARGIN + m.ball.y - m.ball.z * HEIGHT_SCALE, t: performance.now() };
    state.lastHits = m.hits;
    drawFlash();
    if (state.shot) { ctx.strokeStyle = '#f2e94e'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.ellipse(MARGIN + m.racket.x, MARGIN + m.racket.y, RACKET_HALF_W + 4, RACKET_HALF_H + 1, 0, 0, Math.PI * 2); ctx.stroke(); }
    if (m.phase === 'waiting' && m.server === 'bottom' && m.holding) drawPower(m.racket, m.charge);
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
    if (m.message) { ctx.font = 'bold 34px system-ui, sans-serif'; ctx.fillText(m.message, VIEW_W / 2, MARGIN + NET_Y - 30); }
    if (m.message2) { ctx.font = 'bold 30px system-ui, sans-serif'; ctx.fillText(m.message2, VIEW_W / 2, MARGIN + NET_Y + 62); }
  }

  let last = null;
  function frame(t) {
    const dt = last === null ? 0 : Math.min(0.05, (t - last) / 1000);
    last = t;
    const total = dt * Math.max(0, state.speed);
    const n = Math.max(1, Math.ceil(total / MAX_STEP));
    for (let i = 0; i < n; i++) update(total / n);
    showScore();
    draw();
    requestAnimationFrame(frame);
  }
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
